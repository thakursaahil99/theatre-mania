# Hot-reload overlay. Bind-mounts the source trees (Docker Desktop must be allowed to share
# the drive: Settings → Resources → File sharing).
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d --build

services:
  backend:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'"
    volumes: [../backend:/app]

  worker:
    volumes: [../backend:/app, transcode:/tmp/cineverse]

  beat:
    volumes: [../backend:/app]

  frontend:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
      WATCHPACK_POLLING: "true" # reliable file watching on Windows/macOS bind mounts
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_node_modules:
  frontend_next:
